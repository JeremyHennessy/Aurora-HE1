name: Phase 2B propeller operating envelope

on:
  pull_request:
  workflow_dispatch:

jobs:
  propeller-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned headless XFOIL 6.996 wrapper
        run: |
          npm install --no-save --ignore-scripts webxfoil-wasm@0.1.1
          grep -q '5b6363ce4f32062838f5fe910ab924883c05dd7f408454655af6b9a844611120' node_modules/webxfoil-wasm/SOURCES.md
      - name: Fetch authoritative MIT DAE coordinates
        run: python scripts/fetch_mit_airfoils.py
      - name: Generate viscous DAE polars
        run: node scripts/run_xfoil_polars.mjs
      - name: Recheck Phase 2 reference point
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_propeller_bem.py
          python scripts/check_phase2.py
      - name: Run propeller family and off-design trade
        env:
          PYTHONPATH: src
        run: python scripts/run_propeller_family_trade.py
      - name: Validate Phase 2B engineering gates
        run: python scripts/check_phase2b.py
      - name: Preserve Phase 2B analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-propeller-envelope
          path: |
            analysis/phase2b/*.json
            analysis/phase2b/*.csv
          retention-days: 30
