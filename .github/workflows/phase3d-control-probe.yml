name: Phase 3D OpenVSP control-surface probe

on:
  pull_request:
    paths:
      - 'config/phase3d_elevator_trim.json'
      - 'scripts/generate_phase3d_control_probe.py'
      - '.github/workflows/phase3d-control-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check probe sources
        run: |
          python -m py_compile scripts/generate_phase3d_control_probe.py
          python -m json.tool config/phase3d_elevator_trim.json >/dev/null
      - name: Generate control-surface probe
        run: python scripts/generate_phase3d_control_probe.py
      - name: Install pinned OpenVSP 3.51.3
        run: |
          URL=$(python - <<'PY'
          import json
          print(json.load(open('config/phase3d_elevator_trim.json'))['toolchain']['package_url'])
          PY
          )
          curl --fail --location --retry 5 --retry-delay 3 --output /tmp/openvsp.deb "$URL"
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y /tmp/openvsp.deb
          VSP_SCRIPT=$(command -v vspscript || true)
          if [ -z "$VSP_SCRIPT" ]; then
            VSP_SCRIPT=$(find /usr /opt -type f -name vspscript -perm -111 2>/dev/null | head -n 1)
          fi
          test -n "$VSP_SCRIPT"
          echo "VSP_SCRIPT=$VSP_SCRIPT" >> "$GITHUB_ENV"
      - name: Probe OpenVSP control-surface parameter contract
        run: |
          set +e
          "$VSP_SCRIPT" -script analysis/phase3d_probe/control_probe.vspscript >analysis/phase3d_probe/control_probe.log 2>&1
          rc=$?
          set -e
          echo "PHASE3D_PROBE_WRAPPER_RC|${rc}" >> analysis/phase3d_probe/control_probe.log
          cat analysis/phase3d_probe/control_probe.log
          if grep -Eq '^[[:space:]]*PHASE3D_PROBE_(ERROR|API_ERROR)\|' analysis/phase3d_probe/control_probe.log; then
            echo "explicit Phase 3D probe/API error marker found" >&2
            exit 1
          fi
          test -s analysis/phase3d_probe/control_probe.vsp3
          python - <<'PY'
          from pathlib import Path

          lines=[line.strip() for line in Path('analysis/phase3d_probe/control_probe.log').read_text(errors='replace').splitlines()]
          if 'PHASE3D_PROBE_COMPLETE' not in lines:
              raise SystemExit('completion marker missing')

          def marker(prefix):
              for line in lines:
                  if line.startswith(prefix):
                      return [x.strip() for x in line.split('|')]
              raise SystemExit(f'missing marker {prefix}')

          found=marker('PHASE3D_PROBE_FOUND|')
          if found[1:] != ['1','1','1','1','1']:
              raise SystemExit(f'expected control-surface parms were not all found: {found}')

          group=marker('PHASE3D_PROBE_GROUP_COUNT|')
          if int(group[1]) < 1:
              raise SystemExit(f'control surface auto-group was not created: {group}')

          ids=marker('PHASE3D_PROBE_GROUP_IDS|')
          if len(ids) != 4 or any(not x for x in ids[1:]):
              raise SystemExit(f'control group parm IDs missing: {ids}')

          vals=marker('PHASE3D_PROBE_GROUP_VALUES|')
          numbers=[float(x) for x in vals[1:]]
          if len(numbers) != 3 or abs(numbers[0]-10.0)>1e-9 or abs(numbers[1]-1.0)>1e-9 or abs(numbers[2]+1.0)>1e-9:
              raise SystemExit(f'unexpected deflection/gain values: {numbers}')

          required_names={'EtaFlag','EtaStart','EtaEnd','Length_C_Start','Length_C_End','Abs_Rel_Flag','SE_Const_Flag'}
          names=set()
          for line in lines:
              if line.startswith('PHASE3D_PROBE_PARM|'):
                  parts=[x.strip() for x in line.split('|')]
                  if len(parts) >= 2:
                      names.add(parts[1])
          missing=sorted(required_names-names)
          if missing:
              raise SystemExit(f'expected OpenVSP control-surface parameters missing: {missing}')

          print('PHASE 3D CONTROL PROBE CONTRACT PASSED', numbers)
          PY
      - name: Preserve Phase 3D probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d-control-probe
          path: |
            analysis/phase3d_probe/manifest.json
            analysis/phase3d_probe/control_probe.vspscript
            analysis/phase3d_probe/control_probe.vsp3
            analysis/phase3d_probe/control_probe.log
          if-no-files-found: warn
          retention-days: 30
