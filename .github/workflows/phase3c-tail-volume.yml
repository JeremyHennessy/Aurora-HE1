name: Phase 3C tail-volume validation

on:
  pull_request:
    paths:
      - 'config/he1_baseline.json'
      - 'config/phase3c_tail_volume_trade.json'
      - 'src/aurora_he1/geometry.py'
      - 'scripts/generate_phase3b_openvsp.py'
      - 'scripts/generate_phase3c_openvsp.py'
      - 'scripts/parse_phase3c_openvsp.py'
      - 'scripts/check_phase3c.py'
      - '.github/workflows/phase3c-tail-volume.yml'
  push:
    branches: [main]
    paths:
      - 'config/he1_baseline.json'
      - 'config/phase3c_tail_volume_trade.json'
      - 'src/aurora_he1/geometry.py'
      - 'scripts/generate_phase3b_openvsp.py'
      - 'scripts/generate_phase3c_openvsp.py'
      - 'scripts/parse_phase3c_openvsp.py'
      - 'scripts/check_phase3c.py'
      - '.github/workflows/phase3c-tail-volume.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail-volume-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Phase 3C sources
        run: |
          python -m py_compile scripts/generate_phase3c_openvsp.py scripts/parse_phase3c_openvsp.py scripts/check_phase3c.py
          python -m json.tool config/phase3c_tail_volume_trade.json >/dev/null
      - name: Generate sanity and tail-volume cases
        env:
          PYTHONPATH: src
        run: python scripts/generate_phase3c_openvsp.py
      - name: Install pinned OpenVSP 3.51.3
        run: |
          URL=$(python - <<'PY'
          import json
          print(json.load(open('config/phase3c_tail_volume_trade.json'))['toolchain']['package_url'])
          PY
          )
          curl --fail --location --retry 5 --retry-delay 3 --output /tmp/openvsp.deb "$URL"
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y /tmp/openvsp.deb
          VSP_SCRIPT=$(command -v vspscript || true)
          if [ -z "$VSP_SCRIPT" ]; then
            VSP_SCRIPT=$(find /usr /opt -type f -name vspscript -perm -111 2>/dev/null | head -n 1)
          fi
          test -n "$VSP_SCRIPT"
          echo "VSP_SCRIPT=$VSP_SCRIPT" >> "$GITHUB_ENV"
          "$VSP_SCRIPT" -help | head -n 20 || true
          echo "OpenVSP batch executable: $VSP_SCRIPT"
      - name: Run Phase 3C VSPAERO cases
        run: |
          set -u
          shopt -s nullglob
          scripts=(analysis/phase3c/*.vspscript)
          test ${#scripts[@]} -eq 20
          for script in "${scripts[@]}"; do
            case_id=$(basename "$script" .vspscript)
            log="analysis/phase3c/${case_id}.log"
            polar="analysis/phase3c/${case_id}.polar"
            echo "=== Phase 3C case: ${case_id} ==="
            set +e
            "$VSP_SCRIPT" -script "$script" >"$log" 2>&1
            rc=$?
            set -e
            echo "PHASE3C_WRAPPER_RC|${case_id}|${rc}" >> "$log"
            cat "$log"
            if grep -Eq '^[[:space:]]*PHASE3C_(ERROR|API_ERROR)\|' "$log"; then
              echo "${case_id}: explicit Phase 3C solver/API error marker found" >&2
              exit 1
            fi
            if ! grep -q "PHASE3C_COMPLETE|${case_id}" "$log"; then
              echo "${case_id}: completion marker missing (wrapper rc=${rc})" >&2
              exit 1
            fi
            if [ ! -s "$polar" ]; then
              echo "${case_id}: native VSPAERO polar missing/empty (wrapper rc=${rc})" >&2
              exit 1
            fi
            python - "$polar" <<'PY'
          import math
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(errors="replace").splitlines()
          required = ("AoA", "CLtot", "CDi", "CMytot")
          header = None
          start = None
          for i, line in enumerate(lines):
              fields = line.split()
              if all(name in fields for name in required):
                  header = fields
                  start = i + 1
                  break
          if header is None or start is None:
              raise SystemExit(f"{path}: required native-polar header missing")
          idx = [header.index(name) for name in required]
          rows = 0
          for line in lines[start:]:
              fields = line.split()
              if len(fields) < len(header):
                  continue
              try:
                  vals = [float(fields[j]) for j in idx]
              except (ValueError, IndexError):
                  continue
              if all(math.isfinite(v) for v in vals):
                  rows += 1
          if rows != 5:
              raise SystemExit(f"{path}: expected 5 finite native-polar rows, found {rows}")
          print(f"{path}: verified 5 finite native VSPAERO rows")
          PY
          done
      - name: Parse Phase 3C native evidence
        run: python scripts/parse_phase3c_openvsp.py
      - name: Validate reference convention and tail-volume grid
        run: python scripts/check_phase3c.py
      - name: Preserve Phase 3C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-tail-volume-validation
          path: |
            analysis/phase3c/manifest.json
            analysis/phase3c/results.json
            analysis/phase3c/validation_summary.json
            analysis/phase3c/*.vspscript
            analysis/phase3c/*.vsp3
            analysis/phase3c/*.log
            analysis/phase3c/*.polar
            analysis/phase3c/*.history
            analysis/phase3c/*.lod
            analysis/phase3c/*.adb
          if-no-files-found: warn
          retention-days: 30
