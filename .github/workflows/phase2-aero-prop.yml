name: Phase 2 aero and propeller analysis

on:
  pull_request:
  workflow_dispatch:

jobs:
  xfoil-bem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned headless XFOIL 6.996 wrapper
        run: |
          npm install --no-save --ignore-scripts webxfoil-wasm@0.1.1
          grep -q '5b6363ce4f32062838f5fe910ab924883c05dd7f408454655af6b9a844611120' node_modules/webxfoil-wasm/SOURCES.md
      - name: Fetch authoritative MIT DAE coordinates
        run: python scripts/fetch_mit_airfoils.py
      - name: Generate viscous XFOIL 6.996 polars
        run: node scripts/run_xfoil_polars.mjs
      - name: Run DAE51 propeller BEM trade
        env:
          PYTHONPATH: src
        run: python scripts/run_propeller_bem.py
      - name: Preserve Phase 2 analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-aero-prop-analysis
          path: |
            analysis/airfoils/manifest.json
            analysis/polars/*.csv
            analysis/polars/summary.json
            analysis/phase2/*.json
            analysis/phase2/*.csv
          retention-days: 30
