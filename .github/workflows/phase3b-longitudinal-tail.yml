name: Phase 3B longitudinal tail trade

on:
  pull_request:
    paths:
      - 'config/he1_baseline.json'
      - 'config/phase3b_longitudinal_tail.json'
      - 'src/aurora_he1/geometry.py'
      - 'scripts/generate_phase3b_openvsp.py'
      - 'scripts/parse_phase3b_openvsp.py'
      - 'scripts/check_phase3b.py'
      - '.github/workflows/phase3b-longitudinal-tail.yml'
  push:
    branches: [main]
    paths:
      - 'config/he1_baseline.json'
      - 'config/phase3b_longitudinal_tail.json'
      - 'src/aurora_he1/geometry.py'
      - 'scripts/generate_phase3b_openvsp.py'
      - 'scripts/parse_phase3b_openvsp.py'
      - 'scripts/check_phase3b.py'
      - '.github/workflows/phase3b-longitudinal-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  longitudinal-tail-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Phase 3B sources
        run: |
          python -m py_compile scripts/generate_phase3b_openvsp.py scripts/parse_phase3b_openvsp.py scripts/check_phase3b.py
          python -m json.tool config/phase3b_longitudinal_tail.json >/dev/null
      - name: Generate provisional tail-family cases
        env:
          PYTHONPATH: src
        run: python scripts/generate_phase3b_openvsp.py
      - name: Install pinned OpenVSP 3.51.3
        run: |
          URL=$(python - <<'PY'
          import json
          print(json.load(open('config/phase3b_longitudinal_tail.json'))['toolchain']['package_url'])
          PY
          )
          curl --fail --location --retry 5 --retry-delay 3 --output /tmp/openvsp.deb "$URL"
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y /tmp/openvsp.deb
          VSP_SCRIPT=$(command -v vspscript || true)
          if [ -z "$VSP_SCRIPT" ]; then
            VSP_SCRIPT=$(find /usr /opt -type f -name vspscript -perm -111 2>/dev/null | head -n 1)
          fi
          test -n "$VSP_SCRIPT"
          echo "VSP_SCRIPT=$VSP_SCRIPT" >> "$GITHUB_ENV"
          "$VSP_SCRIPT" -help | head -n 20 || true
          echo "OpenVSP batch executable: $VSP_SCRIPT"
      - name: Run main-wing plus horizontal-tail family
        run: |
          set -u
          shopt -s nullglob
          scripts=(analysis/phase3b/*.vspscript)
          test ${#scripts[@]} -gt 0
          for script in "${scripts[@]}"; do
            case_id=$(basename "$script" .vspscript)
            log="analysis/phase3b/${case_id}.log"
            echo "=== Phase 3B case: ${case_id} ==="
            set +e
            "$VSP_SCRIPT" -script "$script" >"$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if grep -Eq '^[[:space:]]*PHASE3B_(ERROR|API_ERROR)\|' "$log"; then
              echo "${case_id}: explicit Phase 3B solver/API error marker found" >&2
              exit 1
            fi
            if ! grep -q "PHASE3B_COMPLETE|${case_id}" "$log"; then
              echo "${case_id}: completion marker missing" >&2
              exit 1
            fi
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 96 ]; then
              echo "${case_id}: unexpected vspscript exit code ${rc}" >&2
              exit "$rc"
            fi
            test -s "analysis/phase3b/${case_id}.polar"
          done
      - name: Parse native VSPAERO stability evidence
        run: python scripts/parse_phase3b_openvsp.py
      - name: Validate longitudinal stability family
        run: python scripts/check_phase3b.py
      - name: Preserve Phase 3B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-longitudinal-tail-family
          path: |
            analysis/phase3b/manifest.json
            analysis/phase3b/results.json
            analysis/phase3b/validation_summary.json
            analysis/phase3b/*.vspscript
            analysis/phase3b/*.vsp3
            analysis/phase3b/*.log
            analysis/phase3b/*.polar
            analysis/phase3b/*.history
            analysis/phase3b/*.lod
            analysis/phase3b/*.adb
          if-no-files-found: warn
          retention-days: 30
