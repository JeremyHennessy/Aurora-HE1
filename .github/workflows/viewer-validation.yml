name: Engineering viewer validation

on:
  pull_request:
    paths:
      - 'viewer/**'
      - 'scripts/check_viewer_snapshot.py'
      - 'scripts/check_sandbox_model.py'
      - '.github/workflows/viewer-validation.yml'
  push:
    paths:
      - 'viewer/**'
      - 'scripts/check_viewer_snapshot.py'
      - 'scripts/check_sandbox_model.py'
      - '.github/workflows/viewer-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Extract and check inline JavaScript modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for source, target in [('viewer/index.html', '/tmp/viewer-app.mjs'), ('viewer/sandbox.html', '/tmp/sandbox-app.mjs')]:
              html = Path(source).read_text()
              blocks = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
              if len(blocks) != 1:
                  raise SystemExit(f'{source}: expected exactly one inline module script, found {len(blocks)}')
              Path(target).write_text(blocks[0])
          PY
          node --check /tmp/viewer-app.mjs
          node --check /tmp/sandbox-app.mjs
      - name: Viewer JSON syntax
        run: |
          python -m json.tool viewer/data/verified_snapshot.json >/dev/null
          python -m json.tool viewer/data/sandbox_model.json >/dev/null
      - name: Engineering snapshot gates
        run: python scripts/check_viewer_snapshot.py
      - name: Scenario sandbox consistency gates
        run: python scripts/check_sandbox_model.py
      - name: Static asset presence
        run: |
          test -s viewer/index.html
          test -s viewer/sandbox.html
          test -s viewer/data/verified_snapshot.json
          test -s viewer/data/sandbox_model.json
