name: Phase 3A OpenVSP main-wing analysis

on:
  pull_request:
    paths:
      - 'config/he1_baseline.json'
      - 'config/phase3a_openvsp.json'
      - 'src/aurora_he1/geometry.py'
      - 'scripts/generate_phase3a_openvsp.py'
      - 'scripts/parse_phase3a_openvsp.py'
      - 'scripts/check_phase3a.py'
      - '.github/workflows/phase3a-openvsp.yml'
  push:
    branches: [main]
    paths:
      - 'config/he1_baseline.json'
      - 'config/phase3a_openvsp.json'
      - 'src/aurora_he1/geometry.py'
      - 'scripts/generate_phase3a_openvsp.py'
      - 'scripts/parse_phase3a_openvsp.py'
      - 'scripts/check_phase3a.py'
      - '.github/workflows/phase3a-openvsp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openvsp-wing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Phase 3A sources
        run: |
          python -m py_compile scripts/generate_phase3a_openvsp.py scripts/parse_phase3a_openvsp.py scripts/check_phase3a.py
          python -m json.tool config/phase3a_openvsp.json >/dev/null
      - name: Generate geometry manifest and OpenVSP script from baseline
        env:
          PYTHONPATH: src
        run: python scripts/generate_phase3a_openvsp.py
      - name: Install pinned OpenVSP 3.51.3
        run: |
          URL=$(python - <<'PY'
          import json
          print(json.load(open('config/phase3a_openvsp.json'))['toolchain']['package_url'])
          PY
          )
          curl --fail --location --retry 5 --retry-delay 3 --output /tmp/openvsp.deb "$URL"
          sudo apt-get update
          # The official OpenVSP 3.51.3 .deb post-install script invokes
          # desktop-file-install but does not declare desktop-file-utils as a
          # package dependency. Install it explicitly on headless CI runners.
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y /tmp/openvsp.deb
          VSP_SCRIPT=$(command -v vspscript || true)
          if [ -z "$VSP_SCRIPT" ]; then
            VSP_SCRIPT=$(find /usr /opt -type f -name vspscript -perm -111 2>/dev/null | head -n 1)
          fi
          test -n "$VSP_SCRIPT"
          echo "VSP_SCRIPT=$VSP_SCRIPT" >> "$GITHUB_ENV"
          "$VSP_SCRIPT" -help | head -n 20 || true
          echo "OpenVSP batch executable: $VSP_SCRIPT"
      - name: Run generated OpenVSP / VSPAERO model
        run: |
          # OpenVSP 3.51.3's packaged vspscript currently returns status 96
          # after a successful scripted main() on this CI runner. Do not infer
          # success from the process code alone: require the explicit Phase 3A
          # completion marker and a non-empty native VSPAERO polar, reject all
          # explicit solver/API error markers, and reject every exit code other
          # than 0 or the observed 96.
          set +e
          "$VSP_SCRIPT" -script analysis/phase3a/aurora_phase3a.vspscript 2>&1 | tee analysis/phase3a/openvsp.log
          VSP_STATUS=${PIPESTATUS[0]}
          set -e

          if grep -Eq '^[[:space:]]*PHASE3A_(ERROR|API_ERROR)\|' analysis/phase3a/openvsp.log; then
            echo 'Explicit Phase 3A solver/API error marker found.' >&2
            exit 1
          fi
          if [ "$VSP_STATUS" -ne 0 ] && [ "$VSP_STATUS" -ne 96 ]; then
            echo "Unexpected vspscript exit code: $VSP_STATUS" >&2
            exit "$VSP_STATUS"
          fi
          grep -Eq '^[[:space:]]*PHASE3A_POLAR\|analysis/phase3a/AURORA_HE1_phase3a\.polar[[:space:]]*$' analysis/phase3a/openvsp.log
          test -s analysis/phase3a/AURORA_HE1_phase3a.polar
          echo "Accepted vspscript completion status: $VSP_STATUS"
      - name: Parse VSPAERO evidence
        run: python scripts/parse_phase3a_openvsp.py
      - name: Validate geometry and induced drag
        run: python scripts/check_phase3a.py
      - name: Preserve Phase 3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3a-openvsp-main-wing
          path: |
            analysis/phase3a/geometry_manifest.json
            analysis/phase3a/aurora_phase3a.vspscript
            analysis/phase3a/AURORA_HE1_phase3a.vsp3
            analysis/phase3a/openvsp.log
            analysis/phase3a/vspaero_results.json
            analysis/phase3a/validation_summary.json
            analysis/phase3a/*.polar
            analysis/phase3a/*.history
            analysis/phase3a/*.lod
            analysis/phase3a/*.adb
          if-no-files-found: warn
          retention-days: 30
